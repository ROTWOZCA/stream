<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="ستريم — منصة موحدة تجمع صفحات مشروع لغة ستريم في ملف HTML واحد.">
<title>ستريم — منصة لغة برمجة عربية</title>
<style>
:root{
  --bg:#070b14;--panel:#0d1422;--panel2:#111a2b;--line:#22304a;
  --text:#eef4ff;--muted:#91a1bb;--accent:#5b8cff;--accent2:#9b6cff;
  --good:#28c58a;--shadow:0 18px 50px rgba(0,0,0,.35);--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI","Cairo",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr}
.topbar{z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(7,11,20,.96);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}
.brand strong{font-size:15px}.brand span{display:block;color:var(--muted);font-size:11px}
.controls{display:flex;gap:8px;margin-inline-start:auto}
.ctrl{border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:10px;padding:8px 11px}
.ctrl:hover{border-color:var(--accent)}
.search{width:min(300px,32vw);border:1px solid var(--line);background:var(--panel);
  color:var(--text);border-radius:10px;padding:9px 12px;outline:none}
.search:focus{border-color:var(--accent)}
.body{min-height:0;display:grid;grid-template-columns:260px 1fr}
.sidebar{overflow:auto;border-left:1px solid var(--line);background:var(--panel)}
.side-title{padding:14px 14px 8px;color:var(--muted);font-size:11px;font-weight:800}
.nav{padding:6px}
.nav button{width:100%;text-align:right;border:1px solid transparent;background:transparent;
 color:var(--muted);padding:10px 11px;border-radius:10px;margin-bottom:3px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:linear-gradient(90deg,rgba(91,140,255,.18),rgba(155,108,255,.12));
 color:var(--text);border-color:rgba(91,140,255,.35)}
.stage{min-width:0;min-height:0;position:relative;background:#050912}
.frame{width:100%;height:100%;border:0;background:white;display:block}
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:30px;background:
 radial-gradient(circle at 50% 25%,rgba(91,140,255,.12),transparent 35%),#050912}
.welcome.hidden{display:none}
.w-card{max-width:720px;text-align:center;background:rgba(13,20,34,.92);border:1px solid var(--line);
 border-radius:20px;padding:34px;box-shadow:var(--shadow)}
.w-card h1{margin:0 0 8px;font-size:clamp(26px,4vw,46px)}
.w-card p{color:var(--muted);line-height:1.8;margin:8px 0}
.w-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:white}
.status{position:absolute;bottom:12px;left:12px;background:rgba(13,20,34,.9);
 border:1px solid var(--line);color:var(--muted);padding:7px 10px;border-radius:9px;font-size:11px}
@media(max-width:800px){
 .body{grid-template-columns:1fr}.sidebar{position:absolute;z-index:4;top:59px;bottom:0;right:0;width:min(82vw,300px);
  transform:translateX(100%);transition:.2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}
 .brand{min-width:0}.brand span{display:none}.search{width:36vw}.desktop-only{display:none!important}
}
@media(min-width:801px){.mobile-menu{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="ctrl mobile-menu" id="menuBtn" title="القائمة">☰</button>
    <div class="brand">
      <div class="brand-mark">س</div>
      <div><strong>ستريم</strong><span>لغة برمجة عربية — ملف واحد</span></div>
    </div>
    <input id="search" class="search" type="search" placeholder="ابحث بين الصفحات..." aria-label="بحث">
    <div class="controls">
      <button class="ctrl desktop-only" id="newTab">↗ فتح الصفحة</button>
      <button class="ctrl desktop-only" id="full">⛶ ملء الشاشة</button>
    </div>
  </header>
  <main class="body">
    <aside class="sidebar" id="sidebar">
      <div class="side-title">صفحات المشروع</div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <section class="stage">
      <div class="welcome" id="welcome">
        <div class="w-card">
          <h1>ستريم — مشروع لغة برمجة عربية</h1>
          <p>تم جمع الصفحات المرسلة في ملف HTML واحد قابل للرفع مباشرة، مع إبقاء محتوى الصفحات الأصلية داخل الملف وتشغيل كل صفحة بمعزل عن الأخرى حتى لا تتعارض المعرفات والدوال.</p>
          <div class="w-actions">
            <button class="ctrl primary" id="start">🚀 ابدأ بالمشروع</button>
            <button class="ctrl" id="first">🌊 افتح الرئيسية</button>
          </div>
        </div>
      </div>
      <iframe id="frame" class="frame" title="صفحة ستريم" hidden></iframe>
      <div class="status" id="status">15 صفحة مدمجة • ملف واحد • بدون مكتبات خارجية للتشغيل</div>
    </section>
  </main>
</div>
